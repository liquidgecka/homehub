# The unique machine ID for this machine within the cluster.
# If you plan to have more than one machine you need to ensure
# that each one uses an id that is unique.
machine_id = 1

# The maximum number of parallel compression operations that can be performed
# at the same time. This prevents the server from being completely saturated
# CPU wise by a lot of compression steps all happening at once. The default
# is 10, and a generally sane number would be to set this to the number of
# CPUs on the machine.
#maximum_parallel_compressions = 10

# The maximum number of parallel delete operations that are allowed to be
# executed at any single moment by this process. Some file systems do not
# perform super well when huge numbers of deletes are all performed at the
# same time. This option allows smoothing of delete operations. The default
# is 10.
#maximum_parallel_deletes = 10

# The maximum number of parallel remote deletes that will be performed.
# Remote deletes are background operations that request a remote server
# delete its local copy of a file this server is hosting. Normally this is
# no expensive however it can overwhelm a server if too many are triggered
# all at once so this option is provided to help smooth that out.
#maximum_parallel_remote_deletes = 10

# The Maximum number of parallel uploads that are allowed to be executed
# at any single moment by this process. Setting this too high can cause
# uploads to timeout which will force them to be retried which can eventually
# saturate the server. Settings this too low forces uploads to queue which can
# cause the server to run out of space. The default is 10.
#maximum_parallel_uploads = 10

# If defined then this will limit the server to deleting only
# a given number of files at a time. This is useful for preventing
# deletes from overwhelming the IO on the server and causing
# performance pauses.
#maximum_parallel_deletes = 10

# An optional location to write the pid file into.
pidfile = "/run/homehub/blobby.pid"

###########################
# Log file configuration.
[log]

# The file to log into.
file = "/var/log/homehub/blobby.log"

# The format of the log file. This supports "plain" and "json".
format = "plain"

# Enable debug logging.
#debug = false

###########################
# HTTP Client Configuration
#
# Configuration for HTTP calls to other homehub servers.
[client]

# The default timeout for http requests to other homehub servers.
timeout = "1m"

############################
# HTTP server configuration.
#
# Configuration here specifically control the http server hosted
# by homehub.
[server]

# The address to bind to for listening. If this is 127.0.0.1 then
# the server will only be accessible to the local machine, where
# "0.0.0.0" will make this available on all interfaces that the
# machine has.
addr = "127.0.0.1"

# The port to listen on.
port = 2001

# If the server is forced to redirect, or needs to refer to its own
# internal host name at any point this string will be used. This is required
# if SAML is in use so that the server can generate the SAML URLs that are
# returned as part of the SP meta data.
#
# This should be a fully qualified domain name that can be used to reach
# the server, including a : if a port is needed.
#host_name = "homehub.example.com"

# If set to true then the server will respond on that port using
# TLS. Setting this requires that the tls certificate be configured
# later in this section.
tls = false

# The path to the file containing the public certificate (and
# chain) for the SSL certificate that will be used. This is a URL
# that uses the formats defined in the "Secret URLs" section.
#tls_certificate_url = "file:/etc/homehub/server.pem"

# The path to the private key element of the TLS certificate. This is a URL
# that uses the formats defined in the "Secret URLs" section.
#tls_private_key_url = "file://etc/homehub/server.key"

# If the connection has spent more than this amount of time
# sending a header to the HTTP server then it will be
# automatically dropped and its headers will be discarded.
read_header_timeout = "10s"

# If a connection has not sent data in this amount of time then
# it will be automatically closed and dropped. Note that this
# can cause short objects to be written for slow clients in some
# edge cases.
read_timeout = "30s"

# If a response was not able to be written to a client in this
# amount of time then it will be automatically discarded.
write_timeout = "30s"

# For idle connections (often called keep-alive connections) this
# will automatically drop them after a given amount of time to
# save resources.
idle_timeout = "1m"

# The maximum number of bytes that a client can send in headers.
# This ensures that a client doesn't accidentally send a huge
# header that runs our local server out of memory.
max_header_bytes = 1048576

# A prefix to add to tags in the generated Prometheus metrics; for example,
# "homehub_" would turn metrics like:
# primary_delete_successes{namespace="test3"} 3
# ..into:
# primary_delete_successes{homehub_namespace="test3"} 3
#
# This is primarily used if the tag will conflict with some element of the
# prometheus namespace.
#prometheus_tag_prefix = "homehub_"

#
# Debugging
#

# If set to true then the server will export debugging information
# via the HTTP server. If enabled its also possible to restrict the
# debugging requests to a given set of access controls.
#debug_paths_enable = false

# When processing requests should traces be added that will greatly increase
# the visibility into requests, while slowing the overall performance of the
# application. The default is false.
#enable_tracing = false

#
# Access Control
#

# The server provides several paths for debugging. These paths are protected
# via this configuration block. See the "Access Control Blocks" section for
# more information about how to restrict access using this. This defaults
# to only allowing access from 127.0.0.1.
#[server.debug_paths_acl]

# The server has a /_status endpoint that will return in text form the current
# status of the server which is controlled via this "Access Control Block"
# which is documented further in the file. The default is to only allow access
# to this endpoint from 127.0.0.1.
#[server.status_acl]

# This will configure who can call the /_shutdown endpoint on this server.
# Calling this will cause the server to start failing health checks and to
# reject new replica creation. This allows all existing calls to properly
# shutdown before the service is stopped. See the "Access Control Blocks"
# section of this document later for information on how to use this. This
# defaults to restriction calls to 127.0.0.1 only.
#[server.shut_down_acl]

# An access control list that protects access specifically to the health
# check endpoint on the server. This can be used to limit who can access
# /_health on this server. See the "Access Control Blocks" section for
# documentation on how to use this.
#[server.health_check_acl]

#
# Cookie Settings
#

# A hard coded list of AES keys (hex encoded) that will be used when encrypting
# cookies used by this service. Supported keys are 128 bite (32 hex characters),
# 192 bits (48 hex characters), or 256 bits (64 hex characters) and all other
# lengths will be rejected. This is a list of keys as hex strings. The first
# key configured will be used to encrypt new keys, however decryption will
# be attempted with all keys this making it possible to rotate keys over time.
#
# Use of this option is strongly discouraged in secure environments as it
# leaves the key in a plain text file. Its far better to use the aes_keys_url
# option instead.
#aes_keys = [
#        "0123456789abcdef0123456789ABCDEF",
#    ]

# Like aes_keys, except the keys will be loaded from a file encoded as a JSON
# array from the file at the specified URL. See the section titled
# "Secret URLs" for more information on how to use this and how to force it
# to refresh periodically.
#aes_keys_url = "file://etc/homehub/aes_keys"

# Should the cookie be set in a way that makes it only usable via TLS. If
# enabled then the cookie will not be sent to any matching domain using the
# http:// protocol. Its generally safe to leave this alone. This will default
# to true if the server is configured to use TLS, otherwise the default is
# false.
#use_secure_cookies = true

# The domain that cookies issued by this server will be restricted too. This
# can be useful for ensuring that the cookie is shared across all homehub
# servers in the same domain. The default is to use the host_name value
# defined above.
#cookie_domain = "example.com"

#
# Web authentication
#

# In order to protect resources within homehub it is possible to define a list
# a users via an Apache style .htpasswd file. This will be loaded via the
# given URL (See "Secret URLs" for information on how to store this data.)
# The format of this file is
#     user:password_hash:tag1:tag2:...
# The tags are optional and can be used for restriction who can access what
# resources via the Access Control Blocks. If this is provided then users will
# be able to login via the /_login page on the homehub service.
#
# In order to use web authentication AES keys must be defined otherwise
# homehub will log an error on startup.
#web_users_htpasswd_url = "file://etc/homehub/htpasswd"

# When a user logins in via the /_login web login path the cookie they are
# given will be valid for the given amount of time. This can be a string
# with a prefix like "1d" or "10m". The default is 1 day.
#web_login_duration = "1d"

# Authentication details will be stored in a cookie with this name once the
# user has successfully logged in. This is needed if the cookie name conflicts
# with other cookies used on this domain. The default is "ba"
#web_auth_cookie_name = "ba"

##########################
# HTTP Server Access Log
#
# If defined then this will log http requests to a access specific
# log file. This logging configuration uses the same log
# configuration keys as [log] above.
[server.access_log]
file = "/var/log/homehub/access.log"
format = "plain"

############################
# SAML
#
# If the Blobby service is configured to be a SAML Service Provider then each
# Identity Provider must be configured via one of these blocks. Each provider
# will be named so it can be referenced via a "Access Control Block", even if
# there is only one provider configured. This name will also be used in the
# URLs that the Identity Provider will need to be configured using.
#[saml.name]

# The URL that metadata will be fetch from in order to configure the local
# Service Provider element of Blobby. This URL must be reachable from the
# Blobby Server. This is a required parameter that should be provided by your
# Identity Provider.
#idp_metadata_url = "https://example.com/idp/metadata"

# The URL that Blobby will redirect to in order to get the Identity Provider
# to initiate login. This is a required parameter.
#idp_url = "https://example.com/login"

# The URL of the private key and public certificate that will be used when
# signing requests that are sent to the Identity Provider. These certificates
# are stored in PEM format as a public and private key pair. See "Secret URLs"
# for information about how these URLS can be defined.
#certificate_url = "file://etc/homehub/saml_cert.pem"
#private_key_url = "file://etc/homehub/saml_key.pem"

# If defined then the cookie set to store SAML authentication details will
# be configured to use this domain when setting cookies. The default will be
# to let the browser define the default domain.
#cookie_domain = ""

# If defined then this will set the cookie name that is used to
# store details about SAML authentication. This will need to be unique
# between SAML providers if more than one is specified. The default is
# "osa".
#cookie_name = "osa"

# When a user authenticates via SAML the cookie will be valid for this
# period of time before the user is forced back through a SAML login
# authentication flow. The default is 1 day.
#cookie_validity = "1d"

# When a user initially hits the homehub server and is unauthenticated
# a SAML authentication will be started and a cookie will be set. This
# login attempt will be valid for a given duration before its marked as
# invalid and the user will be forced to authenticate again. This
# option controls that duration. The default is 1 hour.
#login_duration = "1h"

# When reading attributes from the SAML authentication details the user
# name will be obtained from the attribute with the name given in this
# option. The default is "uid"
#user_name_attribute = "uid"

############################
# Remotes
#
# Remotes configure the list of other servers in the homehub
# cluster. If there are no other remotes in the cluster then
# this can be empty, however replicas needs to be set to 0
# for all name spaces.
#
# Each remote is given its own section, so the following block
# can be copied for each remote.
#[[remote]]

# The host name to use when connecting to the remote. This can be
# an IP address or a host name.
#host = "127.0.0.1"

# The port to use when connecting.
#port = 2001

# The ID for this machine. This must be unique in the cluster
# and can not be the same as machine_id configured above.
#id = 2

# If set to true then communication with this host will be
# done using TLS.
#tls = true

# If tls is true then a host name can be used for verifying the
# TLS connection. This allows all homehub servers to run using
# a single certificate for a common name (homehub.example.com) but
# talk to each other using specific host names.
#verify_host = "homehub.example.com"

# Disable TLS host verification. This is insecure and should be
# avoided at all costs since it will allow man in the middle
# attacks between homehub servers.
#tls_insecure_skip_verify = false

############################
# AWS Profiles
#
# Each profile is named (for use in the sm:// URLs and for defining
# which credentials should be used when uploading to S3 buckets.
#
# The profile name is used after [aws.PROFILE_NAME]
[aws.default]

# If providing AWS keys manually then the following two values
# can be provided. If these are set then from_environment and
# from_ec2_role must be false.
#key_id = "KEY_ID"
#secret_key = "SECRET_KEY"

# Alternatively, the AWS credentials can be gleaned from the
# standard environment variables used with most AWS applications.
#from_environment = false

# Or the credentials can be obtained from the instances identity
# service. This is value when a machine has been given an IAM role
# in EC2 directly.
#from_ec2_role = false

# Time times its necessary to assume a role before using the key
# which can be configured via this optional property. This will
# be the full ARN of the role that needs assumed before use.
#assume_role_arn = "ARN"

############################
# Name Spaces
#
# These are the brunt of the configuration for Blobby. Each
# name space represents a different configuration with possible
# different ending destinations for data, alternative ACLS, etc.
#
# Each name space is represented by a top level directory in the
# HTTP structure.
[namespace.test]

# The path on disk to store data for this name space.
directory = "/var/lib/homehub/test"

# The number of replicas that will be required for writes in this
# name space. Setting this to 0 will make writes very fast as
# replication will not be needed, but the writes will not be
# durable as a machine's data being lost will result in data
# loss of accepted commits. This must be set to a number equal to
# or less than the number of remotes configured above other wise
# it will be impossible to initialize a new replica.
replicas = 0

# The profile to use when uploading files for this namespace.
# Note that this profile must have been defined via the
# Profiles section earlier in this file.
aws_profile = "default"

# The bucket name and prefix path that should be used when
# uploading files into S3.
s3_bucket = "homehub-test-bucket"

# A path that will be prepended to the key name in order to write the
# raw data into a sub path.
#s3_base_path = "/"

# The format that will be used for writing keys into S3. It is possible to
# define paths here rather than using s3_base_path as well. IF this is not
# defined then the default key will be a base64 encoded version of the files
# ID.
#
# This format uses a 'date' tool like percent escaping model with some
# limitations and additions. Possible escape sequences are documented
# here. Note that the time is generated based on when the FID was generated,
# not when the first data is added.
#
# String formatting escape codes:
#   %n  - A \n character
#   %t  - A \t character
#   %%  - A literal percent character
#
# Time formatting escape codes:
#   %a  - Abbreviated week day (Mon, Tue, Wed..)
#   %A  - Full week day (Monday, Tuesday, Wednesday..)
#   %b  - Abbreviated month (Jan, Feb, Mar..)
#   %B  - Full month (January, February, March..)
#   %C  - Century (20 for 2020, 19 for 1970)
#   %d  - Zero padded day of the month. (01 for the 1st)
#   %-d - Unpadded day of the month. (1 for the 1st)
#   %_d - Space padded day of the month.
#   %F  - Same as %Y-%M-%D
#   %H  - Zero padded hour in 24 hour clock. (00, 16..)
#   %-H - Unpadded hour in 24 hour clock. (0, 16..)
#   %_H - Space padded hour in 24 hour clock. (" 0", "16"..)
#   %I  - Zero padded hour in 12 hour clock (12, 01..)
#   %-I - Unpadded hour in 24 hour clock (12, 1..)
#   %_I - Space padded hour in 12 hour clock (12, " 1"..)
#   %j  - Zero padded day of the year (1 to 366)
#   %-j - Unpadded day of the year (1 to 366)
#   %_j - Space padded day of the year (1 to 366)
#   %m  - Zero padded month (01, 02..)
#   %-m - Unpadded month (1, 2..)
#   %_m - Space padded month ("01", "02"..)
#   %M  - Zero padded minute (01, 02..)
#   %-M - Unpadded minute (1, 2..)
#   %_M - Space padded minute (" 1", " 2"..)
#   %p  - Either am or pm depending on the time.
#   %P  - Either AM or PM depending on the time.
#   %q  - The quarter of the date in the year (1, 2, 3, 4)
#   %r  - %I:%M:%S %P  (12:32:01 PM)
#   %R  - %H:%M (20:23)
#   %s  - Seconds since epoch (1970/1/1 midnight)
#   %S  - Zero padded seconds (01, 02..)
#   %-S - Unpadded seconds (1, 2..)
#   %_S - Space padded seconds (" 1", " 2"..)
#   %T  - %H:%M:%S (12:32:15)
#   %u  - Weekday as a number (1 to 7)
#   %w  - Weekday as a number with a zero start (0 to 6)
#   %y  - Full year (1970, 2009..)
#   %Y  - Zero padded two digit year (70, 09..)
#   %-Y - Unpadded two digit year (70, 9..)
#   %_Y - Space padded two digit year ("70", " 9"..)
#
# Machine related escape codes:
#   %K  - Zero padded unique id.
#   %-K - Unpadded unique id.
#   %_K - Space padded unique id.
#   %L  - Zero padded machine id.
#   %-L - Unpadded machine id.
#   %_L - Space padded machine id.
#   %.L - Machine id formatted as an IP address.
#
# In order to ensure uniqueness file names should contain a full date element
# as well as a machine and id element. This will ensure that the destination
# file name is unique and nothing will ever accidentally duplicate.
#s3_key_format = "%y/%m/%d/%H:%M:%S-%L-%K"

# If a file exceeds this size then it will be automatically closed
# and uploaded. This is not an absolute cap on file sizes as it
# is possible for the last write to the file to cause it to become
# larger than this value, however once a file has crossed this
# number it will not have further writes appended to it.
upload_file_size = "100m"

# If the file is older than this value then the file will be
# uploaded regardless of its age. This is useful for ensuring
# that data does not remain stagnant in disk for too long when
# there is a low volume of writes.
upload_older = "30m"

# For performance reasons it may be necessary to ensure that
# a pool of open files exist within this name space. This can
# happen when the name space gets a high volume of very small
# writes and therefor needs to parallelize its data.
min_open_files = 1

# Alternatively you can also limit the maximum number of parallel
# files to open. If the desire is to have a smaller number of
# files even with high traffic spikes then this can be set to a
# lower number. It can not ever be set lower than min_open_files
# though because that doesn't make any sense.
max_open_files = 1


############################
# Secret URLs
#
# Several configuration elements use a URL pattern that allows data to
# be read from multiple places. The idea is to facilitate loading secret
# data from services that house it rather than requiring everything to exist
# on disk.
#
# Valid URL patterns are:
# file:/path/to/file.pem will automatically load the data from a file on disk.
# sm://profile/secret_name will automatically read the given AWS Secret Manager
#    secret named 'secret_name' using the AWS profile named 'profile' defined
#    in the profiles section later.
#
# All URLs support three main query parameters:
# * preload=<bool> (default=true):
#     If this is set to true then the secret will be loaded at startup before
#     incoming requests will be processed.
# * cache=<time> (default 1h):
#     The amount of time that data is allowed to be cached in memory before
#     being refreshed from the source. For things like certificates this means
#     that the certificate will be reloaded.
# * stale=<bool> (default=true):
#     Set to true to allow stale data to be used while the resource is
#     reloaded. Setting this to true ensures that live traffic will only
#     ever be served from cache but means that cached data can become
#     stale if reloading the underlying data starts to have issues.

############################
# Access Control Blocks
#
# In several places through the file its possible to define access control
# blocks. Each of these have the same internal structure which is documented
# here.
#
# The most complicated portion of this configuration is that each element
# can be required which means that all requests MUST match this control block.
# For all non required control types the request must match at least one of
# the remaining access control blocks.
#
# As an example, if a configuration includes a white list and basic auth and
# neither is required then a request that matches an ip, but contains no
# basic auth data would be allowed, or a request that contains basic auth
# data but is not in the white list then it will be allowed as well. If both
# are set to required then the request must both be met.
#
# Each access control block has the following sections:
#
# ##### BASIC AUTH #####
#
# In order to load a list of users from a htpasswd like file a url can be
# provided via the 'basic_auth_htpasswd_url' option. This is a URL
# that uses the formats defined in the "Secret URLs" section. This will load
# the data in the given URL. The format is a modified htpasswd style file
# that uses colon delimited fields. Each line that is empty or starts with
# a # is ignored, all other lines are expected to have at least two fields,
# the first is a user name, the second is a hashed password in the formats
# that htpasswd generates. Any further fields are tags that are attached
# to that specific user.
#basic_auth_htpasswd_url = "file://etc/homehub/htpasswd"
#
# For basic auth requests a realm can be defined that allows the user to
# know which login to use. This will default to "Blobby" if undefined.
#basic_auth_realm = "Blobby"
#
# Its also possible to limit which users have access to this resource
# by specifying which user tags must exist on the user in the htpasswd file.
# If not defined then no tags will be required and all users will be allowed.
#basic_auth_user_tags = ["tag1", "tag2"]
#
# If set to true then basic auth will be required for all requests regardless
# of them meeting any other authentication requirement in the section.
#basic_auth_required = false
#
# ##### WHITE LISTS ###
#
# It is also possible to limit which IPs have access to this resource. This
# is defined as a list of CIDR ranges for IPs that should be allowed. The
# default is to not restrict by IP.
#white_list_cidrs = ["127.0.0.1/32"]
#
# If this is set to true then all requests must be in the white list defined
# above, otherwise this is just one of the allowed authentication paths.
#white_list_required = false
