<!DOCTYPE html>
<html>
<head>
    <title>Upload Photo</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f4; }
        .container { background-color: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 4px rgba(0,0,0,.1); max-width: 600px; margin: auto; }
        h1 { color: #333; }
        input[type="file"] {
            margin-bottom: 10px;
        }
        button {
            background-color: #007bff;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .back-link { display: block; margin-top: 20px; color: #007bff; text-decoration: none; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Upload New Photo</h1>
        <form action="/photos/upload" method="post" enctype="multipart/form-data">
            <label for="photo_file">Choose Photo:</label><br>
            <input type="file" id="photo_file" name="photo_file" accept="image/*" required><br>
            <button type="submit">Upload</button>
        </form>
        <a href="/photos" class="back-link">Back to Photo Management</a>
    </div>
</body>
</html>
