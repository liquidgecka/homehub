<!DOCTYPE html>
<html>
<head>
    <title>Shopping List</title>
    <style>
        body { font-family: sans-serif; }
        .store { border: 1px solid #ccc; padding: 10px; margin-bottom: 20px; }
        .store h2 { margin-top: 0; }
        ul { list-style-type: none; padding-left: 0; }
        li { margin-bottom: 5px; }
        .completed { text-decoration: line-through; color: #888; }
    </style>
</head>
<body>
    <h1>Shopping List</h1>
    <a href="/">Back to Home</a>

    {{range .Stores}}
    <div class="store">
        <h2>{{.Name}}</h2>
        <ul>
            {{range .Items}}
            <li>
                <form action="/shopping/toggle-checked/{{.ID}}" method="post" style="display:inline;">
                    <input type="checkbox" onchange="this.form.submit()" {{if .Checked}}checked{{end}}>
                </form>
                <span class="{{if .Checked}}completed{{end}}">{{.Quantity}} x {{.Name}}</span>
                <a href="/shopping/edit-item/{{.ID}}">[Edit]</a>
                <form action="/shopping/delete-item/{{.ID}}" method="post" style="display:inline;">
                    <button type="submit" onclick="return confirm('Are you sure you want to delete this item?');">[Delete]</button>
                </form>
            </li>
            {{end}}
        </ul>
        <hr>
        <form action="/shopping/add-item" method="post">
            <input type="hidden" name="store_id" value="{{.ID}}">
            <input type="text" name="item_name" placeholder="Item Name" required>
            <input type="number" name="quantity" value="1" min="1" required>
            <button type="submit">Add Item</button>
        </form>
    </div>
    {{end}}

    <hr>
    <h2>Add New Store</h2>
    <form action="/shopping/add-store" method="post">
        <input type="text" name="store_name" placeholder="Store Name" required>
        <button type="submit">Add Store</button>
    </form>
</body>
</html>
