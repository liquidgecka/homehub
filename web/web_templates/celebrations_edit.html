<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Celebration - HomeHub</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --primary: #ec4899;
            --primary-hover: #db2777;
            --primary-light: #fdf2f8;
            --border-color: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            --radius: 14px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Navigation */
        .navbar {
            background-color: #0f172a;
            color: #ffffff;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 64px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            flex-wrap: wrap;
        }
        .nav-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.25rem;
            font-weight: 700;
            color: #ffffff;
            text-decoration: none;
            letter-spacing: -0.02em;
        }
        .nav-brand-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #ec4899, #8b5cf6);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }
        .nav-links {
            display: flex;
            align-items: center;
            gap: 6px;
            list-style: none;
        }
        .nav-links a {
            color: #94a3b8;
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .nav-links a:hover {
            color: #ffffff;
            background-color: #1e293b;
        }
        .nav-links a.active {
            color: #ffffff;
            background-color: #334155;
            font-weight: 600;
        }

        /* Container */
        .container {
            max-width: 650px;
            margin: 0 auto;
            padding: 32px 20px;
            width: 100%;
            flex: 1;
        }

        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.88rem;
            color: var(--text-muted);
            margin-bottom: 20px;
        }
        .breadcrumb a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }
        .breadcrumb a:hover {
            text-decoration: underline;
        }

        .edit-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 30px;
            box-shadow: var(--shadow);
        }
        .edit-card h1 {
            font-size: 1.45rem;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.88rem;
            font-weight: 600;
            color: #334155;
        }
        .form-control {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.92rem;
            outline: none;
            background-color: #ffffff;
            color: var(--text-main);
            transition: border-color 0.2s ease;
        }
        .form-control:focus {
            border-color: var(--primary);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
        }
        @media (max-width: 480px) {
            .form-row { grid-template-columns: 1fr; }
        }

        .btn-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 24px;
            padding-top: 18px;
            border-top: 1px solid var(--border-color);
        }
        .btn-save {
            background-color: var(--primary);
            color: #ffffff;
            padding: 10px 22px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.92rem;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        .btn-save:hover {
            background-color: var(--primary-hover);
        }
        .btn-cancel {
            color: #475569;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.92rem;
            padding: 10px 18px;
            border-radius: 8px;
            transition: background-color 0.2s ease;
        }
        .btn-cancel:hover {
            background-color: #f1f5f9;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            font-size: 0.85rem;
            border-top: 1px solid var(--border-color);
            background-color: #ffffff;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/" class="nav-brand">
            <div class="nav-brand-icon">🏠</div>
            <span>HomeHub</span>
        </a>
        <ul class="nav-links">
            <li><a href="/"><span>🏠</span> Dashboard</a></li>
            <li><a href="/shopping"><span>🛒</span> Shopping</a></li>
            <li><a href="/ledger"><span>💳</span> Ledger</a></li>
            <li><a href="/reminders"><span>⏰</span> Reminders</a></li>
            <li><a href="/celebrations" class="active"><span>🎉</span> Celebrations</a></li>
            <li><a href="/photos"><span>🖼️</span> Photos</a></li>
            <li><a href="/backups"><span>💾</span> Backups</a></li>
        </ul>
    </nav>

    <div class="container">
        <div class="breadcrumb">
            <a href="/">Dashboard</a> &rsaquo;
            <a href="/celebrations">Celebrations</a> &rsaquo;
            <span>Edit Celebration</span>
        </div>

        <div class="edit-card">
            <h1><span>✏️</span> Edit Celebration</h1>
            <form action="/celebrations/edit/{{.ID}}" method="post">
                <div class="form-group">
                    <label for="title">Title / Person</label>
                    <input type="text" id="title" name="title" class="form-control" value="{{.Title}}" required>
                </div>

                <div class="form-group">
                    <label for="type">Celebration Type</label>
                    <select id="type" name="type" class="form-control">
                        <option value="birthday" {{if eq .Type "birthday"}}selected{{end}}>🎈 Birthday</option>
                        <option value="anniversary" {{if eq .Type "anniversary"}}selected{{end}}>💍 Anniversary</option>
                        <option value="graduation" {{if eq .Type "graduation"}}selected{{end}}>🎓 Graduation</option>
                        <option value="school" {{if or (eq .Type "school") (eq .Type "first_day_of_school")}}selected{{end}}>🎒 First Day of School</option>
                        <option value="party" {{if eq .Type "party"}}selected{{end}}>🎉 Party / Milestone</option>
                        <option value="holiday" {{if eq .Type "holiday"}}selected{{end}}>🌟 Holiday</option>
                        <option value="custom" {{if eq .Type "custom"}}selected{{end}}>✨ Custom</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Celebration Date</label>
                    <div class="form-row">
                        <div>
                            <select id="month" name="month" class="form-control" required>
                                <option value="1" {{if eq .Month 1}}selected{{end}}>January (1)</option>
                                <option value="2" {{if eq .Month 2}}selected{{end}}>February (2)</option>
                                <option value="3" {{if eq .Month 3}}selected{{end}}>March (3)</option>
                                <option value="4" {{if eq .Month 4}}selected{{end}}>April (4)</option>
                                <option value="5" {{if eq .Month 5}}selected{{end}}>May (5)</option>
                                <option value="6" {{if eq .Month 6}}selected{{end}}>June (6)</option>
                                <option value="7" {{if eq .Month 7}}selected{{end}}>July (7)</option>
                                <option value="8" {{if eq .Month 8}}selected{{end}}>August (8)</option>
                                <option value="9" {{if eq .Month 9}}selected{{end}}>September (9)</option>
                                <option value="10" {{if eq .Month 10}}selected{{end}}>October (10)</option>
                                <option value="11" {{if eq .Month 11}}selected{{end}}>November (11)</option>
                                <option value="12" {{if eq .Month 12}}selected{{end}}>December (12)</option>
                            </select>
                        </div>
                        <div>
                            <input type="number" id="day" name="day" class="form-control" min="1" max="31" value="{{.Day}}" placeholder="Day (1-31)" required>
                        </div>
                        <div>
                            <input type="number" id="year" name="year" class="form-control" min="0" max="2100" value="{{.Year}}" placeholder="Year (0 = recurring)">
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="message">Overlay Message</label>
                    <input type="text" id="message" name="message" class="form-control" value="{{.Message}}" placeholder="Message shown on screen overlay">
                </div>

                <div class="btn-row">
                    <button type="submit" class="btn-save">Save Changes</button>
                    <a href="/celebrations" class="btn-cancel">Cancel</a>
                </div>
            </form>
        </div>
    </div>

    <footer>
        HomeHub &bull; Connected Family Coordination
    </footer>
</body>
</html>
