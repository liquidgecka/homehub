<!DOCTYPE html>
<html>
<head>
    <title>Edit Ledger Account</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f4; }
        .container { background-color: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 4px rgba(0,0,0,.1); max-width: 600px; margin: auto; }
        h1 { color: #333; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="number"] {
            width: calc(100% - 22px);
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            background-color: #007bff;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .back-link { display: block; margin-top: 20px; color: #007bff; text-decoration: none; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Edit Ledger Account: {{.Name}}</h1>
        <form action="/ledger/edit-account/{{.ID}}" method="post">
            <label for="name">Account Name:</label>
            <input type="text" id="name" name="name" value="{{.Name}}" required>

            <label for="initial_balance">Initial Balance:</label>
            <input type="number" id="initial_balance" name="initial_balance" step="0.01" value="{{.InitialBalance}}" required>

            <label for="current_balance">Current Balance:</label>
            <input type="number" id="current_balance" name="current_balance" step="0.01" value="{{.CurrentBalance}}" required>

            <button type="submit">Update Account</button>
        </form>
        <a href="/ledger" class="back-link">Back to Ledger</a>
    </div>
</body>
</html>
