<!DOCTYPE html>
<html>
<head>
    <title>Edit Shopping Item</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f4; }
        .container { background-color: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 4px rgba(0,0,0,.1); max-width: 600px; margin: auto; }
        h1 { color: #333; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="number"], select {
            width: calc(100% - 22px);
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        input[type="checkbox"] {
            margin-right: 5px;
        }
        button {
            background-color: #007bff;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .back-link { display: block; margin-top: 20px; color: #007bff; text-decoration: none; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Edit Shopping Item: {{.Item.Name}}</h1>
        <form action="/shopping/edit-item/{{.Item.ID}}" method="post">
            <label for="name">Item Name:</label>
            <input type="text" id="name" name="name" value="{{.Item.Name}}" required>

            <label for="quantity">Quantity:</label>
            <input type="number" id="quantity" name="quantity" value="{{.Item.Quantity}}" required>

            <label for="store_id">Store:</label>
            <select id="store_id" name="store_id" required>
                {{range $index, $store := .Stores}}
                    {{if not $store.Disabled}}
                        <option value="{{add $index 1}}" {{if eq (add $index 1) $.Item.StoreID}}selected{{end}}>{{$store.Name}}</option>
                    {{end}}
                {{end}}
            </select>

            <input type="checkbox" id="checked" name="checked" {{if .Item.Checked}}checked{{end}}>
            <label for="checked" style="display: inline;">Purchased</label><br>

            <button type="submit">Update Item</button>
        </form>
        <a href="/shopping" class="back-link">Back to Shopping List</a>
    </div>
</body>
</html>
