<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Shopping Item - HomeHub</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-light: #eef2ff;
            --border-color: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            --radius: 14px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Navigation */
        .navbar {
            background-color: #0f172a;
            color: #ffffff;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 64px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            flex-wrap: wrap;
        }
        .nav-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.25rem;
            font-weight: 700;
            color: #ffffff;
            text-decoration: none;
            letter-spacing: -0.02em;
        }
        .nav-brand-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #6366f1, #3b82f6);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }
        .nav-links {
            display: flex;
            align-items: center;
            gap: 6px;
            list-style: none;
        }
        .nav-links a {
            color: #94a3b8;
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .nav-links a:hover {
            color: #ffffff;
            background-color: #1e293b;
        }
        .nav-links a.active {
            color: #ffffff;
            background-color: #334155;
            font-weight: 600;
        }

        /* Container */
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 32px 20px;
            width: 100%;
            flex: 1;
        }

        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.88rem;
            color: var(--text-muted);
            margin-bottom: 20px;
        }
        .breadcrumb a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }
        .breadcrumb a:hover {
            text-decoration: underline;
        }

        .edit-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 30px;
            box-shadow: var(--shadow);
        }
        .edit-card h1 {
            font-size: 1.45rem;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.88rem;
            font-weight: 600;
            color: #334155;
        }
        .form-control {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.92rem;
            outline: none;
            background-color: #ffffff;
            color: var(--text-main);
            transition: border-color 0.2s ease;
        }
        .form-control:focus {
            border-color: var(--primary);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 20px 0;
            padding: 12px 14px;
            background-color: #f8fafc;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--primary);
        }
        .checkbox-group label {
            font-size: 0.92rem;
            font-weight: 600;
            color: #334155;
            cursor: pointer;
            user-select: none;
        }

        .btn-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 24px;
            padding-top: 18px;
            border-top: 1px solid var(--border-color);
        }
        .btn-save {
            background-color: var(--primary);
            color: #ffffff;
            padding: 10px 22px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.92rem;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        .btn-save:hover {
            background-color: var(--primary-hover);
        }
        .btn-cancel {
            color: #475569;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.92rem;
            padding: 10px 18px;
            border-radius: 8px;
            transition: background-color 0.2s ease;
        }
        .btn-cancel:hover {
            background-color: #f1f5f9;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            font-size: 0.85rem;
            border-top: 1px solid var(--border-color);
            background-color: #ffffff;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/" class="nav-brand">
            <div class="nav-brand-icon">🏠</div>
            <span>HomeHub</span>
        </a>
        <ul class="nav-links">
            <li><a href="/"><span>🏠</span> Dashboard</a></li>
            <li><a href="/shopping" class="active"><span>🛒</span> Shopping</a></li>
            <li><a href="/ledger"><span>💳</span> Ledger</a></li>
            <li><a href="/reminders"><span>⏰</span> Reminders</a></li>
            <li><a href="/celebrations"><span>🎉</span> Celebrations</a></li>
            <li><a href="/photos"><span>🖼️</span> Photos</a></li>
            <li><a href="/backups"><span>💾</span> Backups</a></li>
        </ul>
    </nav>

    <div class="container">
        <div class="breadcrumb">
            <a href="/">Dashboard</a> &rsaquo;
            <a href="/shopping">Shopping</a> &rsaquo;
            <span>Edit Item</span>
        </div>

        <div class="edit-card">
            <h1><span>✏️</span> Edit Shopping Item</h1>
            <form action="/shopping/edit-item/{{.Item.ID}}" method="post">
                <div class="form-group">
                    <label for="name">Item Name</label>
                    <input type="text" id="name" name="name" class="form-control" value="{{.Item.Name}}" required>
                </div>

                <div class="form-group">
                    <label for="quantity">Quantity</label>
                    <input type="number" id="quantity" name="quantity" class="form-control" value="{{.Item.Quantity}}" min="1" required>
                </div>

                <div class="form-group">
                    <label for="store_id">Store</label>
                    <select id="store_id" name="store_id" class="form-control" required>
                        {{range .Stores}}
                        <option value="{{.ID}}" {{if eq .ID $.Item.StoreID}}selected{{end}}>{{.Name}}</option>
                        {{end}}
                    </select>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="checked" name="checked" {{if .Item.Checked}}checked{{end}}>
                    <label for="checked">Mark as purchased</label>
                </div>

                <div class="btn-row">
                    <button type="submit" class="btn-save">Save Changes</button>
                    <a href="/shopping" class="btn-cancel">Cancel</a>
                </div>
            </form>
        </div>
    </div>

    <footer>
        HomeHub &bull; Connected Family Coordination
    </footer>
</body>
</html>
