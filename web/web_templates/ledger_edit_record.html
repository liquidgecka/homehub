<!DOCTYPE html>
<html>
<head>
    <title>Edit Ledger Record</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f4; }
        .container { background-color: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 4px rgba(0,0,0,.1); max-width: 600px; margin: auto; }
        h1 { color: #333; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="number"], select {
            width: calc(100% - 22px);
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            background-color: #007bff;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .back-link { display: block; margin-top: 20px; color: #007bff; text-decoration: none; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Edit Ledger Record (ID: {{.ID}})</h1>
        <form action="/ledger/edit-record/{{.ID}}" method="post">
            <label for="timestamp">Timestamp:</label>
            <input type="datetime-local" id="timestamp" name="timestamp" value="{{.Timestamp.Format "2006-01-02T15:04"}}" required>

            <label for="description">Description:</label>
            <input type="text" id="description" name="description" value="{{.Description}}" required>

            <label for="amount">Amount:</label>
            <input type="number" id="amount" name="amount" step="0.01" value="{{.Amount}}" required>

            <label for="type">Type:</label>
            <select id="type" name="type" required>
                <option value="credit" {{if eq .Type "credit"}}selected{{end}}>Credit</option>
                <option value="debit" {{if eq .Type "debit"}}selected{{end}}>Debit</option>
            </select>

            <button type="submit">Update Record</button>
        </form>
        <a href="/ledger" class="back-link">Back to Ledger</a>
    </div>
</body>
</html>
