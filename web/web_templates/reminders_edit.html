<!DOCTYPE html>
<html>
<head>
    <title>Edit Reminder</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 20px auto; padding: 0 10px; }
        .form-card { border: 1px solid #ddd; padding: 20px; border-radius: 8px; background: #fdfdfd; }
        button { padding: 10px 18px; margin-right: 5px; cursor: pointer; border: none; font-size: 15px; }
        .btn-save { background-color: #2196f3; color: white; }
        .btn-cancel { background-color: #757575; color: white; text-decoration: none; padding: 10px 18px; display: inline-block; font-size: 15px; }
    </style>
</head>
<body>
    <h1>Edit Reminder</h1>
    <a href="/reminders">Back to Reminders</a>
    <hr>

    <div class="form-card">
        <form action="/reminders/edit/{{.ID}}" method="post">
            <p>
                <label><strong>Title:</strong></label><br>
                <input type="text" name="title" value="{{.Title}}" required style="width: 100%; padding: 8px; margin-top: 4px;">
            </p>
            <p>
                <label><strong>Time (HH:MM 24-hr):</strong></label><br>
                <input type="time" name="time" value="{{.Time}}" required style="padding: 8px; margin-top: 4px;">
            </p>
            <p>
                <label><strong>Days:</strong></label><br>
                <select name="days" style="padding: 8px; margin-top: 4px;">
                    <option value="Everyday" {{if eq .Days "Everyday"}}selected{{end}}>Everyday</option>
                    <option value="Weekdays" {{if eq .Days "Weekdays"}}selected{{end}}>Weekdays</option>
                    <option value="Weekends" {{if eq .Days "Weekends"}}selected{{end}}>Weekends</option>
                    <option value="Mon,Wed,Fri" {{if eq .Days "Mon,Wed,Fri"}}selected{{end}}>Mon, Wed, Fri</option>
                    <option value="Tue,Thu" {{if eq .Days "Tue,Thu"}}selected{{end}}>Tue, Thu</option>
                </select>
            </p>
            <p>
                <button type="submit" class="btn-save">Save Changes</button>
                <a href="/reminders" class="btn-cancel">Cancel</a>
            </p>
        </form>
    </div>
</body>
</html>
