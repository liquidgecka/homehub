name: Go CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  socket-security:
    name: Socket Supply Chain Security Scan
    runs-on: ubuntu-latest
    environment: socket-dev
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Socket Security Scan
        run: npx -y @socketsecurity/cli ci
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
          SOCKET_CLI_API_TOKEN: ${{ secrets.SOCKET_SECURITY_API_KEY }}

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install X11 dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libx11-dev xorg-dev

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.24.4'

    - name: Verify formatting
      run: |
        files=$(gofmt -l .)
        if [ -n "$files" ]; then
          echo "The following files are not formatted:"
          echo "$files"
          exit 1
        fi

    - name: Verify license headers
      run: |
        files=$(grep -L "Licensed under the Apache License, Version 2.0" $(find . -name "*.go"))
        if [ -n "$files" ]; then
          echo "The following files are missing the license header:"
          echo "$files"
          exit 1
        fi

    - name: Run tests
      run: packaging/scripts/check 

  deploy:
    runs-on: ubuntu-latest
    needs: [build, socket-security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    permissions:
      contents: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Prepare APT repository directory
      run: |
        if git ls-remote --exit-code --heads origin apt; then
          git clone --branch apt --depth 1 https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git apt-repo
        else
          mkdir -p apt-repo
        fi

    - name: Install build and packaging dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y devscripts debhelper dpkg-dev apt-utils libx11-dev xorg-dev

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.24.4'

    - name: Build Debian package and update APT repository
      env:
        APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
      run: |
        ./packaging/scripts/build_ci_repo.sh apt-repo

    - name: Deploy to APT branch 🚀
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: apt-repo
        branch: apt
        clean: false
